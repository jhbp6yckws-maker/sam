<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>321掲示板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
            background-color: #EFEFEF;
            color: #000000;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #CC0000;
            padding-bottom: 10px;
        }
        h1 {
            color: #CC0000;
            font-size: 22px;
            margin: 0;
            cursor: pointer;
        }
        .box {
            background-color: #FFFFFF;
            border: 1px solid #CCCCCC;
            padding: 15px;
            margin-bottom: 20px;
        }
        .form-row {
            margin-bottom: 10px;
        }
        .form-row label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"] {
            width: 60%;
            padding: 5px;
            font-size: 14px;
        }
        .editor-body {
            min-height: 80px;
            border: 1px solid #CCCCCC;
            padding: 8px;
            margin-top: 5px;
            background: #FFF;
        }
        .btn {
            font-size: 13px;
            padding: 5px 12px;
            cursor: pointer;
            background-color: #F0F0F0;
            border: 1px solid #999999;
            border-radius: 2px;
        }
        .btn:hover { background-color: #E0E0E0; }
        .thread-link {
            color: #0000FF;
            text-decoration: underline;
            cursor: pointer;
            font-size: 16px;
        }
        .res {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #DDDDDD;
        }
        .res-name { color: #008000; font-weight: bold; }
        .res-body { margin-top: 5px; margin-left: 1em; line-height: 1.4; }
        .hidden { display: none !important; }
        .notice-box {
            background-color: #FFF0F0;
            border: 1px solid #CC0000;
            color: #CC0000;
            padding: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1 id="siteTitle">■ 321掲示板 ■</h1>
    </div>

    <div id="lobbyScreen">
        <div class="box">
            <h3>新規スレッドを作成する</h3>
            <form id="createThreadForm">
                <div class="form-row">
                    <label for="newThreadTitle">タイトル :</label>
                    <input type="text" id="newThreadTitle" placeholder="スレッドのタイトル" required>
                </div>
                <div class="form-row">
                    <label for="creatorName">名前 :</label>
                    <input type="text" id="creatorName" placeholder="名無しさん">
                </div>
                <div class="form-row">
                    <label>本文 :</label>
                    <div id="firstMessage" class="editor-body" contenteditable="true" placeholder="最初の書き込み"></div>
                </div>
                <button type="submit" class="btn" id="btnCreateThread">スレッドを建てる</button>
            </form>
        </div>

        <div class="box">
            <h3>スレッド一覧</h3>
            <div id="threadList">読み込み中...</div>
        </div>
    </div>

    <div id="threadScreen" class="hidden">
        <button class="btn" id="btnBack" style="margin-bottom: 15px;">← スレッド一覧に戻る</button>

        <div class="box">
            <h2 id="activeThreadTitle" style="color:#CC0000; margin-top:0;"></h2>
            <div id="threadStats" style="color:#666; font-size:12px; margin-bottom:15px;"></div>
            
            <div id="threadExpiryNotice" class="notice-box hidden"></div>
            <div id="resContainer"></div>
        </div>

        <div class="box" id="postFormBox">
            <h3>このスレッドにレスを書く</h3>
            <form id="postForm">
                <div class="form-row">
                    <label for="name">名前 :</label>
                    <input type="text" id="name" placeholder="名無しさん">
                </div>
                <div class="form-row">
                    <label>本文 :</label>
                    <div id="editorBody" class="editor-body" contenteditable="true"></div>
                </div>

                <div class="form-row">
                    <button type="button" class="btn" id="btnStartAudioCapture">🎙️ 音声を録音 (最大60秒)</button>
                    <span id="audioStatus" style="font-size:12px; color:red; margin-left:10px;"></span>
                </div>

                <button type="submit" class="btn" id="btnSubmitPost">書き込む</button>
            </form>
        </div>

        <div id="threadClosedNotice" class="notice-box hidden">
            🚫 このスレッドは321レスに達したため書き込みできません。（3日21時間後に自動削除されます）
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://iustcqynphestdbqjpiu.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_8GQRZs0KpN3ByPfINhVDFg_j9jMUhPs";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        if (!localStorage.getItem('bbs_user_secret')) {
            localStorage.setItem('bbs_user_secret', Math.random().toString(36).substring(2, 12).toUpperCase());
        }
        const userSecret = localStorage.getItem('bbs_user_secret');

        let activeThreadId = null;
        let pendingAudioBlob = null;
        let mediaRecorder = null, audioChunks = [];

        function escapeHtml(str) { 
            return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; 
        }

        // --- 録音機能 ---
        document.getElementById('btnStartAudioCapture').addEventListener('click', async () => {
            const status = document.getElementById('audioStatus');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    pendingAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    status.innerText = "録音完了！";
                };
                mediaRecorder.start();
                status.innerText = "🔴 録音中... (5秒後に自動停止)";
                setTimeout(() => {
                    if(mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                        stream.getTracks().forEach(t => t.stop());
                    }
                }, 5000);
            } catch(e) {
                alert("マイクの使用が許可されていません。");
            }
        });

        async function uploadAudio(blob) {
            const fileName = `audio_${Date.now()}.webm`;
            const { data, error } = await _supabase.storage.from('media').upload(`uploads/${fileName}`, blob);
            if (error) return "";
            const res = _supabase.storage.from('media').getPublicUrl(`uploads/${fileName}`);
            return res.data.publicUrl;
        }

        // --- 321レス自動削除ロジック ---
        async function checkAndCleanExpiredThreads() {
            const { data: posts } = await _supabase.from('posts').select('id, thread_id, created_at');
            if (!posts) return;

            const map = {};
            posts.forEach(p => {
                if(!map[p.thread_id]) map[p.thread_id] = [];
                map[p.thread_id].push(p);
            });

            const now = Date.now();
            const LIMIT_MS = (3 * 24 + 21) * 60 * 60 * 1000; // 3日21時間

            for (const [tId, tPosts] of Object.entries(map)) {
                if (tPosts.length >= 321) {
                    tPosts.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
                    const res321Time = new Date(tPosts[320].created_at).getTime();
                    if (now >= (res321Time + LIMIT_MS)) {
                        await _supabase.from('posts').delete().eq('thread_id', tId);
                    }
                }
            }
        }

        // --- スレッド一覧取得 ---
        async function fetchThreads() {
            await checkAndCleanExpiredThreads();
            const { data, error } = await _supabase.from('posts').select('thread_id, subject, id').order('id', { ascending: true });
            
            if (error) {
                document.getElementById('threadList').innerText = "取得失敗: Supabaseのアクセス権限(RLS)を確認してください。";
                return;
            }

            const threadMap = {};
            data.forEach(p => {
                if (!threadMap[p.thread_id]) {
                    threadMap[p.thread_id] = { title: p.subject || "無題", count: 0 };
                }
                threadMap[p.thread_id].count++;
            });

            const container = document.getElementById('threadList');
            let html = "";
            Object.keys(threadMap).forEach(tId => {
                const t = threadMap[tId];
                const closed = t.count >= 321 ? ' <span style="color:red;">[321到達: 満杯]</span>' : '';
                html += `<div style="margin-bottom:8px;"><span class="thread-link" onclick="openThread('${tId}')">■ ${escapeHtml(t.title)} (${t.count}レス)${closed}</span></div>`;
            });

            container.innerHTML = html || "スレッドがありません。";
        }

        // --- スレッド表示 ---
        async function renderActiveThread() {
            const { data } = await _supabase.from('posts').select('*').eq('thread_id', activeThreadId).order('id', { ascending: true });
            if (!data || data.length === 0) {
                showScreen('lobby');
                return;
            }

            document.getElementById('activeThreadTitle').innerText = data[0].subject || "無題";
            document.getElementById('threadStats').innerText = `全 ${data.length} / 321 レス`;

            const resCount = data.length;
            if (resCount >= 321) {
                document.getElementById('postFormBox').classList.add('hidden');
                document.getElementById('threadClosedNotice').classList.remove('hidden');
            } else {
                document.getElementById('postFormBox').classList.remove('hidden');
                document.getElementById('threadClosedNotice').classList.add('hidden');
            }

            let html = "";
            data.forEach((p, index) => {
                const audioHtml = p.audio ? `<br><audio src="${p.audio}" controls></audio>` : '';
                html += `
                    <div class="res">
                        <div><b>${index + 1}: ${escapeHtml(p.name)}</b></div>
                        <div class="res-body">${p.message}${audioHtml}</div>
                    </div>
                `;
            });
            document.getElementById('resContainer').innerHTML = html;
        }

        function openThread(tId) {
            activeThreadId = tId;
            showScreen('thread');
        }

        function showScreen(type) {
            if (type === 'lobby') {
                document.getElementById('lobbyScreen').classList.remove('hidden');
                document.getElementById('threadScreen').classList.add('hidden');
                fetchThreads();
            } else {
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('threadScreen').classList.remove('hidden');
                renderActiveThread();
            }
        }

        // --- 新規スレッド作成処理 ---
        document.getElementById('createThreadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('newThreadTitle').value.trim();
            const name = document.getElementById('creatorName').value.trim() || "名無しさん";
            const msg = document.getElementById('firstMessage').innerText.trim() || "（本文なし）";

            if (!title) return alert("タイトルを入力してください。");

            const newThreadId = 'thread_' + Date.now();

            const { error } = await _supabase.from('posts').insert([{
                thread_id: newThreadId,
                subject: title,
                name: name,
                message: msg,
                creator_secret: userSecret
            }]);

            if (error) {
                alert("スレッドの作成に失敗しました:\n" + error.message);
                console.error(error);
            } else {
                document.getElementById('newThreadTitle').value = "";
                document.getElementById('firstMessage').innerText = "";
                openThread(newThreadId);
            }
        });

        // --- レス投稿処理 ---
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim() || "名無しさん";
            const msg = document.getElementById('editorBody').innerText.trim();

            if (!msg && !pendingAudioBlob) return alert("本文を入力してください。");

            let audioUrl = "";
            if (pendingAudioBlob) {
                audioUrl = await uploadAudio(pendingAudioBlob);
            }

            const { error } = await _supabase.from('posts').insert([{
                thread_id: activeThreadId,
                name: name,
                message: msg,
                audio: audioUrl,
                creator_secret: userSecret
            }]);

            if (error) {
                alert("書き込みに失敗しました: " + error.message);
            } else {
                document.getElementById('editorBody').innerText = "";
                document.getElementById('audioStatus').innerText = "";
                pendingAudioBlob = null;
                renderActiveThread();
            }
        });

        document.getElementById('btnBack').addEventListener('click', () => showScreen('lobby'));
        document.getElementById('siteTitle').addEventListener('click', () => showScreen('lobby'));

        // 初期化
        fetchThreads();
    </script>
</body>
</html>
