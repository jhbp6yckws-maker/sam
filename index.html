<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>321掲示板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Kiwi+Maru:wght@500&family=Lobster&family=M+PLUS+Rounded+1c:wght@500;800&family=Pacifico&family=Shippori+Mincho:wght@600&family=Yuji+Syuku&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "ＭＳ Ｐゴシック", "MS PGothic", "ヒラギノ角ゴ Pro W3", sans-serif;
            background-color: #EFEFEF;
            color: #000000;
            padding: 20px;
            padding-bottom: 80px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { color: #CC0000; font-size: 22px; margin: 0; cursor: pointer; }
        h1:hover { text-decoration: underline; }
        
        .admin-badge {
            background-color: #CC0000; color: #FFFFFF;
            padding: 4px 8px; font-size: 12px; font-weight: bold; border-radius: 3px;
        }

        .container { max-width: 800px; }
        .menu-box { background-color: #FFFFFF; border: 1px solid #CCCCCC; padding: 15px; margin-bottom: 20px; }
        .thread-list-item { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .thread-link { color: #0000FF; text-decoration: underline; cursor: pointer; font-size: 16px; }
        .thread-box { background-color: #FFFFFF; border: 1px solid #CCCCCC; padding: 15px; margin-bottom: 20px; position: relative; }
        .thread-title {
            color: #CC0000; font-size: 18px; font-weight: bold; margin-bottom: 15px;
            border-bottom: 2px solid #CC0000; padding-bottom: 5px;
            display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap;
        }
        .thread-stats { font-size: 13px; color: #666666; font-weight: normal; }

        .res {
            margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px dashed #DDDDDD; position: relative;
        }
        .res-header { font-size: 14px; margin-bottom: 5px; }
        .res-name { color: #008000; font-weight: bold; }
        .res-date-id { color: #666666; font-size: 12px; }
        .res-body { font-size: 16px; margin-left: 2em; line-height: 1.5; word-break: break-word; }
        .res-subject { font-weight: bold; color: #CC0000; font-size: 16px; }
        .edited-tag { color: #FF6600; font-size: 11px; font-weight: bold; margin-left: 5px; }
        .ng-masked { color: #999999; font-style: italic; }
        
        .anchor { color: #0000FF; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .res-body a { color: #0000FF; text-decoration: underline; }

        .res-attached-link {
            margin-top: 12px; padding: 6px 12px; background-color: #F4F7F9; border-left: 3px solid #0066CC; font-size: 14px; display: inline-block;
        }
        .res-attached-link a { color: #0066CC; font-weight: bold; text-decoration: underline; }

        .res-actions { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .btn {
            font-size: 12px; padding: 4px 10px; cursor: pointer; background-color: #F0F0F0; border: 1px solid #999999; border-radius: 2px;
        }
        .btn:hover { background-color: #E0E0E0; }
        .btn-like { color: #008000; font-weight: bold; }
        .btn-like.active { background-color: #C8E6C9; border-color: #2E7D32; }
        .btn-dislike { color: #CC0000; font-weight: bold; }
        .btn-dislike.active { background-color: #FFCDD2; border-color: #C62828; }

        .btn-admin { background-color: #333333; color: #FFFFFF; border: 1px solid #000000; }
        .btn-admin:hover { background-color: #555555; }
        .btn-contact { background-color: #0066CC; color: #FFFFFF; border: 1px solid #004080; font-weight: bold; }

        .back-btn { margin-bottom: 15px; margin-right: 5px; display: inline-block; }
        .share-btn { color: #0066CC; font-weight: bold; }
        .delete-btn { color: #CC0000; }
        .admin-delete-btn { color: #FFFFFF; background-color: #CC0000; border-color: #990000; font-weight: bold; }

        .form-box {
            margin-top: 20px; background-color: #FFFFFF; padding: 15px; border: 1px solid #CCCCCC;
            display: inline-block; width: 100%; box-sizing: border-box; max-width: 550px;
        }
        .form-title { font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        .form-box label { display: inline-block; width: 75px; }
        input[type="text"], select, textarea { padding: 4px; box-sizing: border-box; }
        input[type="text"] { width: 80%; }
        
        .editor-container { border: 1px solid #CCCCCC; background: #FFFFFF; margin-bottom: 10px; }
        .editor-toolbar {
            background-color: #F7F7F7; border-bottom: 1px solid #DDDDDD; padding: 6px; display: flex; gap: 10px; align-items: center; font-size: 12px;
        }
        .editor-toolbar label { width: auto !important; font-weight: bold; }
        .editor-body { min-height: 100px; padding: 10px; outline: none; overflow-y: auto; line-height: 1.5; font-size: 16px; }

        .thread-closed-msg {
            background-color: #FFF0F0; border: 2px solid #CC0000; color: #CC0000;
            padding: 15px; font-weight: bold; font-size: 14px; text-align: center; margin-top: 20px; border-radius: 4px;
        }

        #anchorPreviewPopup {
            position: absolute; z-index: 2000; background-color: #FFFFE0; border: 1px solid #999999;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3); padding: 10px; max-width: 400px; width: 90%; font-size: 14px; border-radius: 4px; display: none; pointer-events: none;
        }

        .modal {
            display: none; position: fixed; z-index: 3000; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center;
        }
        .modal-box { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; width: 90%; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1 id="siteTitle">■ 321掲示板 ■</h1>
        <div style="display:flex; gap:6px; align-items:center;">
            <button id="btnOpenContactModal" class="btn btn-contact">📩 管理者にお問い合わせ</button>
            <span id="adminStatusBadge" class="admin-badge hidden">🔑 管理者モード</span>
            <button id="btnAdminLogin" class="btn btn-admin">🔐 管理者ログイン</button>
            <button id="btnAdminLogout" class="btn hidden">🔓 ログアウト</button>
        </div>
    </div>

    <div class="container">
        <div id="lobbyScreen">
            <div id="adminNgPanel" class="menu-box hidden" style="background-color: #FFF0F0; border-left: 4px solid #CC0000;">
                <h4 style="margin: 0 0 8px 0; color: #CC0000;">🚫 管理者メニュー（NG設定・一括削除）</h4>
                <div id="ngPanelBody">
                    <div style="margin-bottom: 6px;">
                        <label style="font-size: 12px; font-weight: bold;">NGワード:</label><br>
                        <input type="text" id="ngWordsInput" style="width:100%; font-size:12px;">
                    </div>
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px; font-weight: bold;">NG ID:</label><br>
                        <input type="text" id="ngIdsInput" style="width:100%; font-size:12px;">
                    </div>
                    <button class="btn btn-admin" id="btnSaveNgSettings" style="font-weight: bold; margin-bottom: 15px;">NG設定を保存</button>
                    <hr>
                    <button class="btn admin-delete-btn" id="btnClearAllThreads" style="padding: 6px 12px; margin-top: 5px;">🔥 全スレッドを一括削除して容量を解放する</button>
                </div>
            </div>

            <div class="menu-box">
                <h3>新規スレッド作成 (最大321レス)</h3>
                <form id="createThreadForm">
                    <div style="margin-bottom: 10px;">
                        <label for="newThreadTitle">お題 :</label>
                        <input type="text" id="newThreadTitle" placeholder="タイトルを入力" required>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label for="creatorName">名前 :</label>
                        <input type="text" id="creatorName" placeholder="名無しさん">
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label for="firstMessage">本文 :</label>
                        <div class="editor-container">
                            <div class="editor-toolbar">
                                <label>🎨 色:</label>
                                <select id="lobbyFmtColor">
                                    <option value="">黒 (標準)</option>
                                    <option value="#CC0000" style="color:#CC0000;">赤色</option>
                                    <option value="#0066CC" style="color:#0066CC;">青色</option>
                                    <option value="#008000" style="color:#008000;">緑色</option>
                                </select>
                            </div>
                            <div id="firstMessage" class="editor-body" contenteditable="true" placeholder="本文を入力..."></div>
                        </div>
                    </div>
                    <button type="submit" class="btn" id="btnCreateThread">スレッド作成</button>
                </form>
            </div>

            <div class="menu-box">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h3 style="margin:0;">スレッド一覧</h3>
                </div>
                <div id="threadList">読み込み中...</div>
            </div>
        </div>

        <div id="threadScreen" class="hidden">
            <button class="btn back-btn" id="btnBack">← 一覧に戻る</button>
            <button class="btn back-btn delete-btn hidden" id="btnDeleteThread">🗑️ このスレッドを削除</button>
            
            <div class="thread-box">
                <div class="thread-title">
                    <span id="activeThreadTitle">読み込み中...</span>
                    <span id="threadStats" class="thread-stats"></span>
                </div>
                <div id="resContainer"></div>
            </div>

            <div id="threadClosedNotice" class="thread-closed-msg hidden"></div>

            <div class="form-box" id="postFormBox">
                <div class="form-title" id="writeFormTitle">このスレッドに書き込む</div>
                <form id="postForm">
                    <div style="margin-bottom: 10px;">
                        <label for="name">名前 :</label>
                        <input type="text" id="name" placeholder="名無しさん">
                    </div>

                    <div class="editor-container">
                        <div class="editor-toolbar">
                            <label>🎨 文字色:</label>
                            <select id="fmtColor">
                                <option value="">黒 (標準)</option>
                                <option value="#CC0000" style="color:#CC0000;">赤色</option>
                                <option value="#0066CC" style="color:#0066CC;">青色</option>
                                <option value="#008000" style="color:#008000;">緑色</option>
                            </select>
                        </div>
                        <div id="editorBody" class="editor-body" contenteditable="true" placeholder="メッセージを入力..."></div>
                    </div>
                    
                    <button type="submit" class="btn" id="btnSubmitPost">書き込む</button>
                </form>
            </div>
        </div>
    </div>

    <div id="anchorPreviewPopup"></div>

    <script>
        const ADMIN_PASSWORD = "sdkousaku321564";
        const SITE_PASSWORD = "冷笑系321";
        let isAdmin = localStorage.getItem('bbs_is_admin') === 'true';

        const SUPABASE_URL = "https://iustcqynphestdbqjpiu.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_8GQRZs0KpN3ByPfINhVDFg_j9jMUhPs";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        if (!localStorage.getItem('bbs_user_secret')) {
            localStorage.setItem('bbs_user_secret', Math.random().toString(36).substring(2, 12).toUpperCase());
        }
        const userSecret = localStorage.getItem('bbs_user_secret');

        let ngWords = JSON.parse(localStorage.getItem('bbs_ng_words') || '[]');
        let ngIds = JSON.parse(localStorage.getItem('bbs_ng_ids') || '[]');

        function getMyDisplayID() {
            const dateObj = new Date();
            const yyyymmdd = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
            const salt = yyyymmdd + userSecret + "global";
            let hash = 2166136261;
            for (let i = 0; i < salt.length; i++) { hash ^= salt.charCodeAt(i); hash = Math.imul(hash, 16777619); }
            return Math.abs(hash).toString(36).substring(0, 8).toUpperCase();
        }

        // --- 🔒 パスワード＆ペナルティ機能 ---
        function checkSiteAccessAndAuth() {
            const myId = getMyDisplayID();

            if (!isAdmin && ngIds.includes(myId)) {
                document.body.innerHTML = `<div style="text-align:center; padding:50px;"><h2>🚫 アクセス制限中</h2><p>ID: <b>${myId}</b> はアクセスが制限されています。</p></div>`;
                return false;
            }

            const lockUntil = parseInt(localStorage.getItem('bbs_lock_until') || '0', 10);
            const now = Date.now();
            if (now < lockUntil) {
                const remainingSec = Math.ceil((lockUntil - now) / 1000);
                document.body.innerHTML = `<div style="text-align:center; padding:50px;"><h2>⏳ 一時ロック中</h2><p>解除まであと ${remainingSec} 秒</p></div>`;
                return false;
            }

            if (sessionStorage.getItem('bbs_authenticated') === 'true') return true;

            let attempts = parseInt(localStorage.getItem('bbs_pwd_attempts') || '0', 10);
            const inputPass = prompt(`🔑 閲覧パスワードを入力してください (ミス回数: ${attempts}回):`);

            if (inputPass === SITE_PASSWORD) {
                localStorage.setItem('bbs_pwd_attempts', '0');
                sessionStorage.setItem('bbs_authenticated', 'true');
                return true;
            } else if (inputPass !== null) {
                attempts += 1;
                localStorage.setItem('bbs_pwd_attempts', attempts.toString());
                const penaltySeconds = attempts * 30;
                localStorage.setItem('bbs_lock_until', (Date.now() + penaltySeconds * 1000).toString());
                alert(`❌ パスワード不一致。${penaltySeconds}秒間ロックします。`);
                location.reload();
                return false;
            } else {
                document.body.innerHTML = `<div style="text-align:center; padding:50px;"><h2>🔑 パスワードが必要です</h2></div>`;
                return false;
            }
        }

        let activeThreadId = null;
        let currentPostsData = [];

        function escapeHtml(str) { return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }

        async function fetchThreads() {
            const { data, error } = await _supabase.from('posts').select('*').order('id', { ascending: true });
            if (error || !data) return;

            const threadMap = {};
            const now = Date.now();

            // スレッド集計 & 3日21時間自動消滅ロジック
            for (const post of data) {
                const tId = post.thread_id;
                if (!threadMap[tId]) {
                    threadMap[tId] = { id: tId, title: post.subject || "無題", count: 0, lastPostTime: post.created_at, posts: [] };
                }
                threadMap[tId].count++;
                threadMap[tId].posts.push(post);
            }

            // 自動消滅チェック (321レス到達時のタイマー制御)
            for (const tId in threadMap) {
                const thread = threadMap[tId];
                if (thread.count >= 321) {
                    const lastResTime = new Date(thread.posts[320].created_at).getTime();
                    const expireTime = lastResTime + (93 * 60 * 60 * 1000); // 3日21時間 = 93時間

                    if (now > expireTime) {
                        // ⏰ 期限切れのため自動削除
                        await _supabase.from('posts').delete().eq('thread_id', tId);
                        delete threadMap[tId];
                    }
                }
            }

            const container = document.getElementById('threadList');
            let htmlBuf = "";
            Object.values(threadMap).forEach(t => {
                let statusTag = "";
                if (t.count >= 321) {
                    const lastResTime = new Date(t.posts[320].created_at).getTime();
                    const expireTime = lastResTime + (93 * 60 * 60 * 1000);
                    const remainMs = expireTime - now;
                    const remainHours = Math.floor(remainMs / (1000 * 60 * 60));
                    statusTag = ` <span style="color:red; font-weight:bold;">[321完走: あと ${remainHours}時間で完全消滅]</span>`;
                }
                htmlBuf += `<div class="thread-list-item"><span class="thread-link" data-id="${t.id}">■ ${escapeHtml(t.title)} (${t.count})${statusTag}</span></div>`;
            });

            container.innerHTML = htmlBuf || '<div>現在スレッドはありません。</div>';
        }

        async function renderActiveThread() {
            if (!activeThreadId) return;

            const { data, error } = await _supabase.from('posts').select('*').eq('thread_id', activeThreadId).order('id', { ascending: true });
            if (error || !data || data.length === 0) return;

            currentPostsData = data;
            const resCount = data.length;
            const firstPost = data[0];

            document.getElementById('activeThreadTitle').innerText = firstPost.subject || "無題のスレッド";
            document.getElementById('threadStats').innerText = `(${resCount} / 321レス)`;

            const postFormBox = document.getElementById('postFormBox');
            const closedNotice = document.getElementById('threadClosedNotice');

            if (resCount >= 321) {
                postFormBox.classList.add('hidden');
                closedNotice.classList.remove('hidden');

                const lastResTime = new Date(data[320].created_at).getTime();
                const expireTime = lastResTime + (93 * 60 * 60 * 1000); // 3日21時間
                const remainMs = expireTime - Date.now();
                const remainHours = Math.floor(remainMs / (1000 * 60 * 60));
                const remainMins = Math.floor((remainMs % (1000 * 60 * 60)) / (1000 * 60));

                closedNotice.innerHTML = `🚫 このスレッドは321レスに達しました。<br>⏳ <b>完全消滅まであと ${remainHours}時間 ${remainMins}分</b> (到達から3日21時間後に削除されます)`;
            } else {
                postFormBox.classList.remove('hidden');
                closedNotice.classList.add('hidden');
            }

            const container = document.getElementById('resContainer');
            let html = "";
            data.forEach((res, index) => {
                const resNum = index + 1;
                const dateObj = new Date(res.created_at);
                const dateStr = `${dateObj.getFullYear()}/${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2, '0')}`;

                html += `
                    <div class="res">
                        <div class="res-header">
                            <b>${resNum}</b> : <span class="res-name">${escapeHtml(res.name)}</span> : <span class="res-date-id">${dateStr}</span>
                        </div>
                        <div class="res-body">${res.message}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 新規投稿処理 (軽量化)
        document.getElementById('postForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (currentPostsData.length >= 321) {
                alert("このスレッドは321レスに達しています。");
                return;
            }

            const messageHtml = document.getElementById('editorBody').innerHTML.trim();
            if (!messageHtml) return;

            await _supabase.from('posts').insert([{
                name: document.getElementById('name').value.trim() || "名無しさん",
                message: messageHtml,
                thread_id: activeThreadId,
                creator_secret: userSecret
            }]);

            document.getElementById('editorBody').innerHTML = "";
            renderActiveThread();
        });

        // 管理者：全スレッド一括削除
        document.getElementById('btnClearAllThreads').addEventListener('click', async () => {
            if (confirm("⚠️ 本当に全スレッドを削除して容量を解放しますか？")) {
                await _supabase.from('posts').delete().neq('id', 0);
                alert("全データの削除が完了しました。");
                location.reload();
            }
        });

        function showScreen(id) {
            if (id === 'lobby') {
                document.getElementById('lobbyScreen').classList.remove('hidden');
                document.getElementById('threadScreen').classList.add('hidden');
                fetchThreads();
            } else {
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('threadScreen').classList.remove('hidden');
                renderActiveThread();
            }
        }

        document.getElementById('threadList').addEventListener('click', e => {
            if (e.target.classList.contains('thread-link')) {
                activeThreadId = e.target.getAttribute('data-id');
                showScreen('thread');
            }
        });

        document.getElementById('siteTitle').addEventListener('click', () => showScreen('lobby'));
        document.getElementById('btnBack').addEventListener('click', () => showScreen('lobby'));

        // 管理者モード切替
        document.getElementById('btnAdminLogin').addEventListener('click', () => {
            if (prompt("パスワード:") === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('bbs_is_admin', 'true');
                document.getElementById('adminNgPanel').classList.remove('hidden');
                alert("管理者として認証しました。");
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (!checkSiteAccessAndAuth()) return;
            showScreen('lobby');
        });
    </script>
</body>
</html>
