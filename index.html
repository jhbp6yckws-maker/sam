<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>321掲示板</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: #f4f4f9;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #444;
        }

        .post-form {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-row {
            margin-bottom: 12px;
        }

        .form-row label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-row input[type="text"],
        .form-row textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .submit-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        /* --- 画像高画質表示・プレビュー用CSS --- */
        .img-preview-box {
            margin-top: 10px;
            max-width: 200px;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
            object-fit: contain;
        }

        .uploaded-img {
            max-width: 100%;
            max-height: 400px;
            height: auto;
            display: block;
            margin-top: 10px;
            border: 1px solid #CCCCCC;
            border-radius: 4px;
            cursor: zoom-in;
            /* ブラウザによるぼやけを軽減 */
            image-rendering: -webkit-optimize-contrast;
            object-fit: contain;
        }

        /* 拡大モーダル表示 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            max-width: 95vw;
            max-height: 95vh;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            border-radius: 4px;
            object-fit: contain;
        }

        /* 投稿一覧表示 */
        .post-list {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .post-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-header {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }

        .post-name {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <h1>321掲示板</h1>

    <!-- 投稿フォーム -->
    <div class="post-form">
        <form id="postForm">
            <div class="form-row">
                <label for="username">名前</label>
                <input type="text" id="username" placeholder="名無しさん" value="名無しさん">
            </div>
            <div class="form-row">
                <label for="comment">コメント</label>
                <textarea id="comment" rows="4" required placeholder="コメントを入力してください"></textarea>
            </div>
            <div class="form-row">
                <label for="mediaFile">画像・ファイル添付</label>
                <input type="file" id="mediaFile" accept="image/*,video/*,audio/*">
                <!-- 高画質プレビュー表示用エリア -->
                <img id="imagePreview" class="img-preview-box" alt="添付プレビュー">
            </div>
            <div id="attachmentPreview"></div>
            <button type="submit" class="submit-btn">投稿する</button>
        </form>
    </div>

    <!-- 投稿一覧 -->
    <div class="post-list">
        <h2>投稿一覧</h2>
        <div id="postsContainer">
            <!-- 投稿内容がここに追加されます -->
        </div>
    </div>

    <!-- 画像拡大表示用モーダル -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <img id="modalImage" class="modal-content" src="" alt="拡大画像">
    </div>

    <script>
        let pendingFileToUpload = null;

        // HTMLエスケープ処理
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 添付ファイルの解除処理
        function clearAttachments() { 
            pendingFileToUpload = null; 
            document.getElementById('attachmentPreview').innerHTML = ""; 
            document.getElementById('mediaFile').value = "";
            
            const previewImg = document.getElementById('imagePreview');
            if (previewImg) {
                previewImg.style.display = 'none';
                previewImg.src = '';
            }
        }

        // ファイル選択時の処理（高画質プレビュー表示）
        document.getElementById('mediaFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const previewImg = document.getElementById('imagePreview');
            
            if (!file) {
                return clearAttachments();
            }
            
            if (file.size > 50 * 1024 * 1024) {
                alert("⚠️ 50MBを超えるファイルは選択できません。");
                return clearAttachments();
            }
            
            pendingFileToUpload = file;
            document.getElementById('attachmentPreview').innerHTML = `📎 添付選択中: ${escapeHtml(file.name)} (${(file.size / (1024 * 1024)).toFixed(1)}MB)`;

            // 画像ファイルの場合は高画質で即時プレビュー表示
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    previewImg.src = evt.target.result;
                    previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                previewImg.style.display = 'none';
                previewImg.src = '';
            }
        });

        // フォーム送信処理
        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('username').value || '名無しさん';
            const comment = document.getElementById('comment').value;
            const postsContainer = document.getElementById('postsContainer');
            const now = new Date().toLocaleString('ja-JP');

            let mediaHtml = '';

            // 画像が選択されている場合、高画質表示用の設定でHTML作成
            if (pendingFileToUpload && pendingFileToUpload.type.startsWith('image/')) {
                const previewImg = document.getElementById('imagePreview');
                const imageUrl = previewImg.src;
                mediaHtml = `<img src="${imageUrl}" class="uploaded-img" onclick="openModal('${imageUrl}')" alt="投稿画像">`;
            }

            const postElement = document.createElement('div');
            postElement.className = 'post-item';
            postElement.innerHTML = `
                <div class="post-header">
                    <span class="post-name">${escapeHtml(name)}</span> ・ <span>${now}</span>
                </div>
                <div class="post-body">
                    ${escapeHtml(comment).replace(/\n/g, '<br>')}
                </div>
                ${mediaHtml}
            `;

            postsContainer.prepend(postElement);

            // フォームのリセット
            document.getElementById('comment').value = '';
            clearAttachments();
        });

        // モーダルを開く（高画質拡大表示）
        function openModal(imgUrl) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = imgUrl;
            modal.style.display = 'flex';
        }

        // モーダルを閉じる
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>
</html>
