<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掲示板 (5日間限定自動消去)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            padding: 20px 10px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.8rem;
            color: #1a202c;
        }
        header p {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 4px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #4a5568;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .file-hint {
            font-size: 0.8rem;
            color: #e53e3e;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .thread-list-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #2d3748;
            border-left: 4px solid #3182ce;
            padding-left: 10px;
        }
        .thread {
            border: 1px solid #e2e8f0;
            transition: transform 0.1s;
        }
        .thread-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2b6cb0;
            margin-bottom: 8px;
        }
        .thread-content {
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            color: #2d3748;
            margin-bottom: 12px;
        }
        .thread-media {
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .thread-media img, .thread-media video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            display: block;
        }
        .thread-footer {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #a0aec0;
            display: flex;
            justify-content: space-between;
        }
        .loading {
            text-align: center;
            color: #718096;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>💬 掲示板</h1>
            <p>※投稿された内容は 5日間（120時間）経過すると自動消去されます</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="titleInput">タイトル</label>
                <input type="text" id="titleInput" placeholder="スレッドのタイトルを入力">
            </div>
            <div class="form-group">
                <label for="contentInput">本文</label>
                <textarea id="contentInput" placeholder="投稿内容を入力してください..."></textarea>
            </div>
            <div class="form-group">
                <label for="mediaFile">画像・動画を添付 (任意)</label>
                <input type="file" id="mediaFile" accept="image/*,video/*">
                <div class="file-hint">※無料枠保護のため、動画は短いもの（50MB以下推奨）にしてください</div>
            </div>
            <button id="submitBtn">投稿する</button>
        </div>

        <h2 class="thread-list-title">最新の投稿</h2>
        <div id="threadList" class="loading">投稿を読み込んでいます...</div>
    </div>

    <script>
        // ==========================================
        // 🛠️ 1. Supabase 接続設定 (ここを変更してください)
        // ==========================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 定数設定: 5日間 (ミリ秒)
        const FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;

        // ==========================================
        // 📤 2. 新規投稿処理
        // ==========================================
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const titleInput = document.getElementById('titleInput');
            const contentInput = document.getElementById('contentInput');
            const fileInput = document.getElementById('mediaFile');
            const submitBtn = document.getElementById('submitBtn');

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const file = fileInput.files[0];

            if (!title || !content) {
                alert("タイトルと本文を入力してください。");
                return;
            }

            // 二重投稿防止
            submitBtn.disabled = true;
            submitBtn.innerText = "送信中...";

            let mediaUrl = null;

            try {
                // ファイルが存在する場合、Supabase Storageへアップロード
                if (file) {
                    // 50MBを超えるファイルはエラーにする（Supabase無料枠保護）
                    if (file.size > 50 * 1024 * 1024) {
                        alert("⚠️ ファイルサイズが大きすぎます。50MB以下のファイルを選択してください。");
                        submitBtn.disabled = false;
                        submitBtn.innerText = "投稿する";
                        return;
                    }

                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    const filePath = `uploads/${fileName}`;

                    // 'media' バケットにファイルをアップロード
                    const { error: uploadError } = await supabase.storage
                        .from('media')
                        .upload(filePath, file);

                    if (uploadError) {
                        throw new Error("ファイルのアップロードに失敗しました: " + uploadError.message);
                    }

                    // ファイルの公開URLを取得
                    const { data: urlData } = supabase.storage
                        .from('media')
                        .getPublicUrl(filePath);

                    mediaUrl = urlData.publicUrl;
                }

                // データベース 'threads' テーブルへ投稿情報を追加
                const { error: insertError } = await supabase
                    .from('threads')
                    .insert([{
                        title: title,
                        content: content,
                        media_url: mediaUrl,
                        created_at: new Date().toISOString()
                    }]);

                if (insertError) {
                    throw new Error("データベースへの保存に失敗しました: " + insertError.message);
                }

                // 入力欄のリセット
                titleInput.value = '';
                contentInput.value = '';
                fileInput.value = '';

                // スレッド一覧の再読み込み
                await fetchThreads();

            } catch (err) {
                alert(err.message);
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "投稿する";
            }
        });

        // ==========================================
        // 📥 3. スレッド取得 & 5日経過スレッドの自動削除
        // ==========================================
        async function fetchThreads() {
            const container = document.getElementById('threadList');

            const { data: threads, error } = await supabase
                .from('threads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="loading">データの読み込みに失敗しました。<br>${error.message}</div>`;
                return;
            }

            if (!threads || threads.length === 0) {
                container.innerHTML = '<div class="loading">投稿されたスレッドはまだありません。</div>';
                return;
            }

            container.innerHTML = '';
            const now = new Date().getTime();

            for (const thread of threads) {
                const createdAt = new Date(thread.created_at).getTime();
                const elapsed = now - createdAt;

                // ⏰ 投稿から5日（120時間）以上経過している場合
                if (elapsed > FIVE_DAYS_MS) {
                    // バックグラウンドでデータベースから完全削除
                    deleteExpiredThread(thread.id, thread.media_url);
                    continue; // 画面表示をスキップ
                }

                // 画面描画用のカード要素を作成
                const threadEl = document.createElement('div');
                threadEl.className = 'card thread';

                let mediaHtml = '';
                if (thread.media_url) {
                    // 動画ファイルか画像ファイルかを判定
                    if (thread.media_url.match(/\.(mp4|webm|mov|ogg)$/i)) {
                        mediaHtml = `
                            <div class="thread-media">
                                <video src="${thread.media_url}" controls preload="metadata"></video>
                            </div>`;
                    } else {
                        mediaHtml = `
                            <div class="thread-media">
                                <img src="${thread.media_url}" alt="添付画像" loading="lazy">
                            </div>`;
                    }
                }

                const postDate = new Date(thread.created_at).toLocaleString('ja-JP');

                threadEl.innerHTML = `
                    <div class="thread-title">${escapeHtml(thread.title)}</div>
                    <div class="thread-content">${escapeHtml(thread.content)}</div>
                    ${mediaHtml}
                    <div class="thread-footer">
                        <span>投稿日時: ${postDate}</span>
                        <span>自動消去まで: あと ${Math.ceil((FIVE_DAYS_MS - elapsed) / (1000 * 60 * 60 * 24))} 日</span>
                    </div>
                `;

                container.appendChild(threadEl);
            }

            // 表示できるスレッドがなくなった場合
            if (container.children.length === 0) {
                container.innerHTML = '<div class="loading">表示できるスレッドがありません（すべて有効期限切れです）。</div>';
            }
        }

        // ==========================================
        // 🗑️ 4. 期限切れスレッドの自動消去処理
        // ==========================================
        async function deleteExpiredThread(id, mediaUrl) {
            try {
                // 1. 添付ストレージファイルがある場合は削除
                if (mediaUrl) {
                    const urlParts = mediaUrl.split('/uploads/');
                    if (urlParts.length > 1) {
                        const filePath = `uploads/${urlParts[1]}`;
                        await supabase.storage.from('media').remove([filePath]);
                    }
                }

                // 2. データベースのレコードを削除
                await supabase.from('threads').delete().eq('id', id);
                console.log(`🗑️ 5日以上経過したため自動削除しました (ID: ${id})`);
            } catch (err) {
                console.error("自動削除エラー:", err);
            }
        }

        // HTMLエスケープ関数 (XSS対策)
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ページロード時に初期化実行
        fetchThreads();
    </script>
</body>
</html>
